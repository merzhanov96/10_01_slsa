name: SLSA Go Builder

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write      # для загрузки артефактов в релиз
  actions: read        # для чтения метаданных workflow
  id-token: write      # для OIDC-аутентификации

jobs:
  build:
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v1.5.0
    with:
      go-version: 1.19
      config-file: .slsa-goreleaser.yml
